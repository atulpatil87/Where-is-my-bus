name: busindia
description: "A unified bus tracking app for all major Indian cities."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / Fonts
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_database: ^11.1.3
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4

  # Google Sign In
  google_sign_in: ^6.2.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local Storage
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Location / Maps
  geolocator: ^12.0.0

  # Bluetooth LE — peer-to-peer location sharing mesh (BitChat-style)
  bluetooth_low_energy: ^6.1.0

  # Utils
  dartz: ^0.10.1
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.4.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
